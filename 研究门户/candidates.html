<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>候选事件研判台 | 竹鉴</title>
    <link rel="stylesheet" href="./styles.css?v=20260505-1" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero dashboard-hero compact-hero">
        <div class="hero-copy">
          <a class="back-link" href="./index.html">← 返回研究门户</a>
          <p class="eyebrow">Candidate Pool</p>
          <h1>候选事件研判台</h1>
          <p class="hero-text">这里不是新闻列表，而是把官方来源候选按“待读、已入库、待材料、暂不研判”分流，避免标题级信息混进正式研究。</p>
        </div>
        <div class="hero-panel">
          <div class="hero-stat">
            <span class="label">候选总数</span>
            <span id="candidateTotal" class="value">-</span>
          </div>
          <div class="hero-stat">
            <span class="label">覆盖公司</span>
            <span id="candidateCompanyCount" class="value">-</span>
          </div>
          <div class="hero-stat">
            <span class="label">待研判</span>
            <span id="candidatePendingCount" class="value">-</span>
          </div>
          <div class="hero-stat">
            <span class="label">已入库</span>
            <span id="candidatePromotedCount" class="value">-</span>
          </div>
        </div>
      </header>

      <main>
        <section class="section">
          <div class="section-heading">
            <p class="section-kicker">Review Queue</p>
            <h2>研判队列</h2>
            <p class="muted">优先看“待研判”。“已入库”说明已经沉淀到公司主页；“待材料”说明现在不能只凭日程写结论；“暂不研判”用于拦住低信号内容。</p>
          </div>
          <div id="candidateFilters" class="candidate-filter-row"></div>
          <div id="candidateFeed" class="candidate-review-grid"></div>
        </section>
      </main>
    </div>
    <script src="./candidate-data.js?v=20260516-3"></script>
    <script src="./review-draft-data.js?v=20260516-3"></script>
    <script src="./candidates.js?v=20260516-3"></script>
  </body>
</html>
