name: Daily Brief

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * 1-5"

jobs:
  daily-brief:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: 云端研究简报系统

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate fallback daily brief
        run: python3 scripts/generate_daily_brief.py

      - name: Choose brief with freshness guard
        run: python3 scripts/prepare_brief_to_send.py

      - name: Send to WeCom
        continue-on-error: true
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
        run: python3 scripts/send_wecom.py outputs/brief_to_send.md

      - name: Upload brief artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: daily-brief-output
          path: |
            云端研究简报系统/outputs/daily_brief.md
            云端研究简报系统/outputs/morning_brief.md
            云端研究简报系统/outputs/brief_to_send.md
            云端研究简报系统/outputs/event_store.json
            云端研究简报系统/outputs/official_candidates.json
            云端研究简报系统/outputs/decision_queue.json
            云端研究简报系统/outputs/decision_impact.json
            云端研究简报系统/outputs/decision_deposition.json
            云端研究简报系统/outputs/company_page_overrides.json
            云端研究简报系统/outputs/company_state.json
            云端研究简报系统/outputs/reviewed_events.json
            云端研究简报系统/outputs/snapshots/manifest.json
            研究门户/candidate-data.js
            研究门户/decision-data.js
            研究门户/decision-impact-data.js
            研究门户/decision-deposition-data.js
            研究门户/company-page-overrides-data.js
            研究门户/event-store-data.js
            研究门户/company-state-data.js
          if-no-files-found: warn
