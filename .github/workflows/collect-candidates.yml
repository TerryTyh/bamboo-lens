name: Collect Candidates

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1-5"

jobs:
  collect-candidates:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    defaults:
      run:
        working-directory: 云端研究简报系统

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect official candidates
        run: |
          python3 scripts/collect_official_snapshots.py
          python3 scripts/extract_official_candidates.py
          python3 scripts/enrich_candidate_summaries.py
          python3 scripts/build_event_store.py
          python3 scripts/export_portal_candidate_data.py
          python3 scripts/export_portal_event_store_data.py
          python3 scripts/build_company_state.py
          python3 scripts/build_decision_queue.py
          python3 scripts/build_review_drafts.py
          python3 scripts/build_decision_impact.py
          python3 scripts/build_decision_deposition.py
          python3 scripts/build_company_page_overrides.py
          python3 scripts/audit_company_page_readability.py
          python3 scripts/audit_company_page_mainlines.py
          python3 scripts/collect_market_snapshots.py
          python3 scripts/generate_daily_brief.py
          python3 scripts/build_morning_brief.py
          python3 scripts/check_automation_health.py
          python3 scripts/export_portal_docs.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SUMMARY_MODEL: ${{ vars.OPENAI_SUMMARY_MODEL || 'gpt-4.1-mini' }}

      - name: Persist outputs to repository
        working-directory: .
        run: |
          if git diff --quiet -- 云端研究简报系统/outputs 研究门户/candidate-data.js 研究门户/decision-data.js 研究门户/review-draft-data.js 研究门户/decision-impact-data.js 研究门户/decision-deposition-data.js 研究门户/company-page-overrides-data.js 研究门户/company-readability-audit-data.js 研究门户/company-mainline-audit-data.js 研究门户/automation-health-data.js 研究门户/event-store-data.js 研究门户/company-state-data.js 研究门户/market-snapshot-data.js 研究门户/docs; then
            echo "No generated output changes to commit."
            exit 0
          fi

          git config user.name "bamboo-lens-bot"
          git config user.email "bamboo-lens-bot@users.noreply.github.com"
          git add -f 云端研究简报系统/outputs/daily_brief.md
          git add -f 云端研究简报系统/outputs/morning_brief.md
          git add -f 云端研究简报系统/outputs/event_store.json
          git add -f 云端研究简报系统/outputs/official_candidates.json
          git add -f 云端研究简报系统/outputs/decision_queue.json
          git add -f 云端研究简报系统/outputs/review_draft_index.json
          git add -f 云端研究简报系统/outputs/review_drafts
          git add -f 云端研究简报系统/outputs/decision_impact.json
          git add -f 云端研究简报系统/outputs/decision_deposition.json
          git add -f 云端研究简报系统/outputs/company_page_overrides.json
          git add -f 云端研究简报系统/outputs/company_page_readability_audit.json
          git add -f 云端研究简报系统/outputs/company_page_readability_audit.md
          git add -f 云端研究简报系统/outputs/company_page_mainline_audit.json
          git add -f 云端研究简报系统/outputs/company_page_mainline_audit.md
          git add -f 云端研究简报系统/outputs/company_state.json
          git add -f 云端研究简报系统/outputs/market_snapshot.json
          git add -f 云端研究简报系统/outputs/automation_health.json
          git add -f 云端研究简报系统/outputs/automation_health.md
          git add -f 云端研究简报系统/outputs/reviewed_events.json
          git add 研究门户/candidate-data.js
          git add 研究门户/decision-data.js
          git add 研究门户/review-draft-data.js
          git add 研究门户/decision-impact-data.js
          git add 研究门户/decision-deposition-data.js
          git add 研究门户/company-page-overrides-data.js
          git add 研究门户/company-readability-audit-data.js
          git add 研究门户/company-mainline-audit-data.js
          git add 研究门户/automation-health-data.js
          git add 研究门户/event-store-data.js
          git add 研究门户/company-state-data.js
          git add 研究门户/market-snapshot-data.js
          git add 研究门户/docs
          git commit -m "chore: collect Bamboo Lens candidates"
          git push

      - name: Upload collection artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: candidate-collection-output
          path: |
            云端研究简报系统/outputs/daily_brief.md
            云端研究简报系统/outputs/morning_brief.md
            云端研究简报系统/outputs/event_store.json
            云端研究简报系统/outputs/official_candidates.json
            云端研究简报系统/outputs/decision_queue.json
            云端研究简报系统/outputs/review_draft_index.json
            云端研究简报系统/outputs/review_drafts
            云端研究简报系统/outputs/decision_impact.json
            云端研究简报系统/outputs/decision_deposition.json
            云端研究简报系统/outputs/company_page_overrides.json
            云端研究简报系统/outputs/company_page_readability_audit.json
            云端研究简报系统/outputs/company_page_readability_audit.md
            云端研究简报系统/outputs/company_page_mainline_audit.json
            云端研究简报系统/outputs/company_page_mainline_audit.md
            云端研究简报系统/outputs/company_state.json
            云端研究简报系统/outputs/market_snapshot.json
            云端研究简报系统/outputs/automation_health.json
            云端研究简报系统/outputs/automation_health.md
            云端研究简报系统/outputs/reviewed_events.json
            云端研究简报系统/outputs/snapshots/manifest.json
            研究门户/candidate-data.js
            研究门户/decision-data.js
            研究门户/review-draft-data.js
            研究门户/decision-impact-data.js
            研究门户/decision-deposition-data.js
            研究门户/company-readability-audit-data.js
            研究门户/company-mainline-audit-data.js
            研究门户/automation-health-data.js
            研究门户/company-page-overrides-data.js
            研究门户/event-store-data.js
            研究门户/company-state-data.js
            研究门户/market-snapshot-data.js
            研究门户/docs
          if-no-files-found: warn
