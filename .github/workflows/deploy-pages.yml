name: Deploy Research Portal

on:
  push:
    branches:
      - main
    paths:
      - "研究门户/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_run:
    workflows:
      - Collect Candidates
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static portal
        run: |
          python3 云端研究简报系统/scripts/export_portal_docs.py
          touch 研究门户/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 研究门户

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
